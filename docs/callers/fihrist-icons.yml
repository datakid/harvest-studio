name: Icons

on:
  push:
    branches: [main]
    paths: [fihrist.json]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  icons:
    permissions:
      contents: write
      pull-requests: write
    uses: datakid/harvest-studio/.github/workflows/harvest-icons.yml@v0.2.0
    with:
      set: fihrist
      links-path: fihrist.json
      icons-dir: icons
      base-sha: ${{ github.event.before }}
      head-sha: ${{ github.sha }}
    secrets: inherit
